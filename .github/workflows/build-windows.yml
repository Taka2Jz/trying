name: Build Emulator Hub for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for the build machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EmulatorHub --collect-all PySide6 main.py

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmulatorHub-Windows-Portable
          path: dist/EmulatorHub.exe
          if-no-files-found: error
